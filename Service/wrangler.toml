# Cloudflare Workers + D1. `docs/PHASE_8_DECISIONS.md` D3 is why.
#
# Nothing secret is in this file. The signing key is a Workers secret, set with
#
#   npx wrangler secret put LICENSE_SIGNING_KEY
#
# and its value is exactly the base64 in `~/.localdictation/license-signing-key`
# — the same identity `Tools/licensekit.swift` has been issuing keys with, so
# moving issuing here invalidates nothing already sold.

name = "localdictation-activation"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[vars]
# The public half, as it appears in `LicenseAuthority.productionPublicKeyBase64`.
# It is public by definition and it is here so `/v1/health` can prove the secret
# in this deployment signs keys this app will accept.
LICENSE_PUBLIC_KEY = "enDKT/48nxi+u3x4Qv1qJCDXx5YFe7WVlW5r77IIsJM="
MAIL_PROVIDER = "none"
MAIL_FROM = "LocalDictation <keys@localdictation.app>"

# D2, executed: Stripe, as merchant of record. WEBHOOK_SECRET is a secret and
# is set with `wrangler secret put`, not here.
#
# The two links are the required pair, and they are what makes this endpoint
# safe on an account that sells more than one product: Stripe delivers every
# event on the account to every endpoint, a Payment Link checkout carries no
# line items, and the link the buyer clicked is therefore the only thing in that
# payload that says the sale was ours. A session for any other link matches
# neither and is ignored.
#
# Everything after the sale -- renewals, refunds, disputes -- is matched to a
# licence by an identifier this service recorded itself, in `provider_refs`, and
# never by the customer's address: one account can sell two products to the same
# person, and a refund for the other one must not touch this one's licence.
PAYMENT_PROVIDER = "stripe"
PAYMENT_LINK_LIFETIME = "plink_1UBsx2HOSgmME2jEse2p1dor"
PAYMENT_LINK_ANNUAL = "plink_1UBsxhHOSgmME2jEYQctLUIb"

# Optional, and only read when a checkout session arrives with its line items
# expanded, which a Payment Link's does not. Kept because it costs nothing and
# it is one more way for a sale to be recognised as ours.
PRICE_LIFETIME = "price_1UBstqHOSgmME2jEJc3X8NVq"
PRICE_ANNUAL = ""

# Created in the EEUR region, which is where the licence table lives and what
# `docs/PRIVACY.md` has to say about it. The binding is `DB` and not the name
# wrangler suggests: the code reads `env.DB`.
[[d1_databases]]
binding = "DB"
database_name = "localdictation-licenses"
database_id = "50ad83fb-6a8d-4fc5-be79-3b494da2d50f"
