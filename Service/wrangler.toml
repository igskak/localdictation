# Cloudflare Workers + D1. `docs/PHASE_8_DECISIONS.md` D3 is why.
#
# Nothing secret is in this file. The signing key is a Workers secret, set with
#
#   npx wrangler secret put LICENSE_SIGNING_KEY
#
# and its value is exactly the base64 in `~/.localdictation/license-signing-key`
# — the same identity `Tools/licensekit.swift` has been issuing keys with, so
# moving issuing here invalidates nothing already sold.

name = "localdictation-activation"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[vars]
# The public half, as it appears in `LicenseAuthority.productionPublicKeyBase64`.
# It is public by definition and it is here so `/v1/health` can prove the secret
# in this deployment signs keys this app will accept.
LICENSE_PUBLIC_KEY = "enDKT/48nxi+u3x4Qv1qJCDXx5YFe7WVlW5r77IIsJM="
MAIL_PROVIDER = "none"
MAIL_FROM = "LocalDictation <keys@localdictation.app>"

[[d1_databases]]
binding = "DB"
database_name = "localdictation-licenses"
database_id = "REPLACE_WITH_THE_D1_DATABASE_ID"

# Staging. The client refuses plain HTTP, so there is no localhost path in and
# no "allow insecure in Debug" flag: a staging hostname with a real certificate
# is the only way to point a Debug build at something.
[env.staging]
name = "localdictation-activation-staging"

[env.staging.vars]
LICENSE_PUBLIC_KEY = "enDKT/48nxi+u3x4Qv1qJCDXx5YFe7WVlW5r77IIsJM="
MAIL_PROVIDER = "none"
MAIL_FROM = "LocalDictation <keys@localdictation.app>"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "localdictation-licenses-staging"
database_id = "REPLACE_WITH_THE_STAGING_D1_DATABASE_ID"
