name: Windows CI

on:
  pull_request:
    paths:
      - "Windows/**"
      - ".config/dotnet-tools.json"
      - ".github/workflows/windows-*.yml"
      - "AGENTS.md"
  push:
    branches:
      - "codex/windows-witness"
    paths:
      - "Windows/**"
      - ".config/dotnet-tools.json"
      - ".github/workflows/windows-*.yml"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  build-test:
    name: Build and test x64
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: Windows/**/packages.lock.json

      - name: Record runner boundary
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture
          Write-Host "This hosted runner is not evidence for physical Windows 11, standard-user UIPI, microphones, or GPUs."

      - name: Restore locked packages
        working-directory: Windows
        run: |
          dotnet restore Witness.Windows.sln --locked-mode
          dotnet restore src/Witness.App/Witness.App.csproj --locked-mode -p:PublishProfile=Beta -p:PublishReadyToRun=true
          dotnet tool restore

      - name: Build managed solution
        working-directory: Windows
        run: dotnet build Witness.Windows.sln --configuration Release --no-restore -m:1

      - name: Run cross-platform Core tests
        working-directory: Windows
        run: dotnet test tests/Witness.Core.Tests/Witness.Core.Tests.csproj --configuration Release --no-build --no-restore

      - name: Run signed-update source tests
        working-directory: Windows
        run: dotnet test tests/Witness.Update.Tests/Witness.Update.Tests.csproj --configuration Release --no-build --no-restore

      - name: Run Windows platform tests
        working-directory: Windows
        run: dotnet test tests/Witness.Platform.Tests/Witness.Platform.Tests.csproj --configuration Release --no-build --no-restore
        env:
          WITNESS_CAPTURE_UI_EVIDENCE: "1"
          WITNESS_UI_EVIDENCE_DIRECTORY: ${{ github.workspace }}\Windows\artifacts\ui-evidence

      - name: Verify synthetic W5 UI evidence
        shell: pwsh
        run: |
          $directory = "Windows/artifacts/ui-evidence"
          $expected = @(
            "w5-dictionary-synthetic.png",
            "w5-onboarding-synthetic.png",
            "w5-settings-synthetic.png"
          )
          $actual = @(Get-ChildItem $directory -File | Sort-Object Name | ForEach-Object Name)
          if (Compare-Object $expected $actual) {
            throw "Synthetic W5 UI evidence did not contain the exact allowlisted files."
          }
          Windows/tools/assert-artifact-privacy.ps1 -Path $directory

      - name: Upload synthetic W5 UI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: witness-windows-w5-ui-synthetic-${{ github.sha }}
          path: Windows/artifacts/ui-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Configure native CPU build
        run: >-
          cmake -S Windows/native/Witness.Native -B Windows/artifacts/native
          -DWITNESS_ENABLE_VULKAN=OFF
          -DWITNESS_BUILD_TESTS=ON

      - name: Build native CPU adapter
        run: cmake --build Windows/artifacts/native --config Release --parallel 2

      - name: Run native ownership and ABI tests
        run: >-
          ctest --test-dir Windows/artifacts/native -C Release
          --output-on-failure -R "^witness_native_(contract|audio_conversion|audio_resampler)_tests$"

      - name: Download and verify CI-only whisper fixture model
        shell: pwsh
        run: |
          $fixture = Get-Content Windows/config/native-smoke-fixture.json | ConvertFrom-Json
          $directory = "Windows/artifacts/native-smoke"
          $model = Join-Path $directory $fixture.model
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          Invoke-WebRequest -Uri $fixture.source -OutFile $model
          $actualHash = (Get-FileHash -Path $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $fixture.sha256) {
            throw "Native smoke model SHA-256 mismatch."
          }
          if ((Get-Item $model).Length -ne $fixture.sizeBytes) {
            throw "Native smoke model size mismatch."
          }

      - name: Generate non-user synthetic speech fixture
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Speech
          $fixture = Get-Content Windows/config/native-smoke-fixture.json | ConvertFrom-Json
          $wav = "Windows/artifacts/native-smoke/synthetic-witness.wav"
          $format = [System.Speech.AudioFormat.SpeechAudioFormatInfo]::new(
            16000,
            [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen,
            [System.Speech.AudioFormat.AudioChannel]::Mono)
          $speaker = New-Object System.Speech.Synthesis.SpeechSynthesizer
          try {
            $speaker.SetOutputToWaveFile($wav, $format)
            $speaker.Speak($fixture.audio.text)
          } finally {
            $speaker.Dispose()
          }
          if ((Get-Item $wav).Length -le 44) {
            throw "Synthetic speech fixture is empty."
          }

      - name: Run RAM-only CPU inference smoke
        shell: pwsh
        run: |
          $fixture = Get-Content Windows/config/native-smoke-fixture.json | ConvertFrom-Json
          $model = Join-Path "Windows/artifacts/native-smoke" $fixture.model
          $wav = "Windows/artifacts/native-smoke/synthetic-witness.wav"
          $smoke = Get-ChildItem Windows/artifacts/native -Recurse -Filter witness_native_inference_smoke.exe
          if ($smoke.Count -ne 1) {
            throw "Expected one native inference smoke executable; found $($smoke.Count)."
          }
          $vulkan = Get-ChildItem Windows/artifacts/native/bin/Release -File -Filter "*vulkan*.dll"
          if ($vulkan) {
            throw "CPU smoke build unexpectedly contains a Vulkan runtime."
          }
          & $smoke.FullName $model $wav
          if ($LASTEXITCODE -ne 0) {
            throw "Native CPU inference smoke failed with exit code $LASTEXITCODE."
          }

      - name: Cache pinned public product-model candidate
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: Windows/artifacts/language-model-cache
          key: witness-whisper-large-v3-turbo-q5_0-394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2

      - name: Download and verify W3 language regression inputs
        shell: pwsh
        run: |
          $fixture = Get-Content Windows/config/language-regression.json | ConvertFrom-Json
          $root = "Windows/artifacts/language-regression"
          $modelDirectory = "Windows/artifacts/language-model-cache"
          $model = Join-Path $modelDirectory $fixture.model.artifact
          $installer = Join-Path $root "espeak-ng-$($fixture.speechGenerator.version).msi"
          $piperArchive = Join-Path $root $fixture.ukrainianSpeechGenerator.artifact
          $piperModel = Join-Path $root $fixture.ukrainianSpeechGenerator.voice.modelArtifact
          $piperConfig = Join-Path $root $fixture.ukrainianSpeechGenerator.voice.configArtifact
          New-Item -ItemType Directory -Path $root, $modelDirectory -Force | Out-Null

          if (-not (Test-Path $model)) {
            Invoke-WebRequest -Uri $fixture.model.source -OutFile $model
          }
          if ((Get-FileHash -Path $model -Algorithm SHA256).Hash.ToLowerInvariant() -ne $fixture.model.sha256) {
            throw "W3 product-model SHA-256 mismatch."
          }
          if ((Get-Item $model).Length -ne $fixture.model.sizeBytes) {
            throw "W3 product-model size mismatch."
          }

          Invoke-WebRequest -Uri $fixture.speechGenerator.source -OutFile $installer
          if ((Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $fixture.speechGenerator.sha256) {
            throw "eSpeak NG installer SHA-256 mismatch."
          }
          if ((Get-Item $installer).Length -ne $fixture.speechGenerator.sizeBytes) {
            throw "eSpeak NG installer size mismatch."
          }

          Invoke-WebRequest -Uri $fixture.ukrainianSpeechGenerator.source -OutFile $piperArchive
          if ((Get-FileHash -Path $piperArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $fixture.ukrainianSpeechGenerator.sha256) {
            throw "Piper archive SHA-256 mismatch."
          }
          if ((Get-Item $piperArchive).Length -ne $fixture.ukrainianSpeechGenerator.sizeBytes) {
            throw "Piper archive size mismatch."
          }

          Invoke-WebRequest -Uri $fixture.ukrainianSpeechGenerator.voice.modelSource -OutFile $piperModel
          if ((Get-FileHash -Path $piperModel -Algorithm SHA256).Hash.ToLowerInvariant() -ne $fixture.ukrainianSpeechGenerator.voice.modelSha256) {
            throw "Piper Ukrainian voice model SHA-256 mismatch."
          }
          if ((Get-Item $piperModel).Length -ne $fixture.ukrainianSpeechGenerator.voice.modelSizeBytes) {
            throw "Piper Ukrainian voice model size mismatch."
          }

          Invoke-WebRequest -Uri $fixture.ukrainianSpeechGenerator.voice.configSource -OutFile $piperConfig
          if ((Get-FileHash -Path $piperConfig -Algorithm SHA256).Hash.ToLowerInvariant() -ne $fixture.ukrainianSpeechGenerator.voice.configSha256) {
            throw "Piper Ukrainian voice config SHA-256 mismatch."
          }
          if ((Get-Item $piperConfig).Length -ne $fixture.ukrainianSpeechGenerator.voice.configSizeBytes) {
            throw "Piper Ukrainian voice config size mismatch."
          }

      - name: Generate non-user multilingual speech fixtures
        shell: pwsh
        run: |
          $fixture = Get-Content Windows/config/language-regression.json | ConvertFrom-Json
          $root = (Resolve-Path "Windows/artifacts/language-regression").Path
          $installer = Join-Path $root "espeak-ng-$($fixture.speechGenerator.version).msi"
          $extracted = Join-Path $root "espeak"
          $extraction = Start-Process msiexec.exe `
            -ArgumentList @("/a", $installer, "/qn", "TARGETDIR=$extracted") `
            -Wait -PassThru -NoNewWindow
          if ($extraction.ExitCode -ne 0) {
            throw "eSpeak NG administrative extraction failed with exit code $($extraction.ExitCode)."
          }

          $generators = @(Get-ChildItem $extracted -Recurse -File -Filter espeak-ng.exe)
          $dataDirectories = @(Get-ChildItem $extracted -Recurse -Directory -Filter espeak-ng-data)
          if ($generators.Count -ne 1 -or $dataDirectories.Count -ne 1) {
            throw "Expected exactly one eSpeak NG executable and data directory."
          }
          $dataParent = $dataDirectories[0].Parent.FullName
          foreach ($audio in @($fixture.audio | Where-Object generator -eq "espeak")) {
            $voiceListing = @(& $generators[0].FullName "--path=$dataParent" "--voices=$($audio.voice)" 2>&1)
            $voicePattern = "(?m)^\s*\d+\s+$([regex]::Escape($audio.voice))\s+"
            if ($LASTEXITCODE -ne 0 -or ($voiceListing -join "`n") -notmatch $voicePattern) {
              throw "Pinned eSpeak NG does not expose the requested $($audio.voice) voice."
            }
            $textPath = Join-Path $root "$($audio.language).txt"
            $wavPath = Join-Path $root "$($audio.language).wav"
            Set-Content -Path $textPath -Value $audio.text -Encoding utf8NoBOM -NoNewline
            & $generators[0].FullName "--path=$dataParent" -b 1 -v $audio.voice -s 145 -w $wavPath -f $textPath
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $wavPath) -or (Get-Item $wavPath).Length -le 44) {
              throw "Synthetic $($audio.language) speech generation failed."
            }
          }

          $piperArchive = Join-Path $root $fixture.ukrainianSpeechGenerator.artifact
          $piperRoot = Join-Path $root "piper"
          Expand-Archive -LiteralPath $piperArchive -DestinationPath $piperRoot -Force
          $piperExecutables = @(Get-ChildItem $piperRoot -Recurse -File -Filter piper.exe)
          if ($piperExecutables.Count -ne 1) {
            throw "Expected exactly one Piper executable."
          }
          $ukrainianAudio = @($fixture.audio | Where-Object generator -eq "piper")
          if ($ukrainianAudio.Count -ne 1 -or $ukrainianAudio[0].language -ne "uk") {
            throw "Expected exactly one Piper-generated Ukrainian fixture."
          }
          $ukrainianText = Join-Path $root "uk.txt"
          $ukrainianWav = Join-Path $root "uk.wav"
          $piperModel = Join-Path $root $fixture.ukrainianSpeechGenerator.voice.modelArtifact
          $piperConfig = Join-Path $root $fixture.ukrainianSpeechGenerator.voice.configArtifact
          Set-Content -Path $ukrainianText -Value $ukrainianAudio[0].text -Encoding utf8NoBOM -NoNewline
          Get-Content -Path $ukrainianText -Raw -Encoding utf8 | & $piperExecutables[0].FullName `
            --model $piperModel --config $piperConfig --output_file $ukrainianWav
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $ukrainianWav) -or (Get-Item $ukrainianWav).Length -le 44) {
            throw "Synthetic Ukrainian Piper speech generation failed."
          }

      - name: Run W3 multilingual leading-noise regression
        shell: pwsh
        run: |
          $fixture = Get-Content Windows/config/language-regression.json | ConvertFrom-Json
          $root = "Windows/artifacts/language-regression"
          $model = Join-Path "Windows/artifacts/language-model-cache" $fixture.model.artifact
          $regression = @(Get-ChildItem Windows/artifacts/native -Recurse -Filter witness_native_language_regression.exe)
          if ($regression.Count -ne 1) {
            throw "Expected one native language regression executable; found $($regression.Count)."
          }
          & $regression[0].FullName $model (Join-Path $root "de.wav") (Join-Path $root "en.wav") (Join-Path $root "ru.wav") (Join-Path $root "uk.wav")
          if ($LASTEXITCODE -ne 0) {
            throw "W3 multilingual language regression failed with exit code $LASTEXITCODE."
          }

      - name: Run W3 synthetic CPU benchmark harness
        shell: pwsh
        run: |
          $fixture = Get-Content Windows/config/language-regression.json | ConvertFrom-Json
          $root = "Windows/artifacts/language-regression"
          $model = Join-Path "Windows/artifacts/language-model-cache" $fixture.model.artifact
          $benchmark = @(Get-ChildItem Windows/artifacts/native -Recurse -Filter witness_native_benchmark.exe)
          if ($benchmark.Count -ne 1) {
            throw "Expected one native benchmark executable; found $($benchmark.Count)."
          }
          & $benchmark[0].FullName $model (Join-Path $root "en.wav") en cpu 1
          if ($LASTEXITCODE -ne 0) {
            throw "W3 synthetic CPU benchmark failed with exit code $LASTEXITCODE."
          }

      - name: Remove native smoke inputs before artifact assembly
        if: always()
        shell: pwsh
        run: |
          Remove-Item Windows/artifacts/native-smoke -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item Windows/artifacts/language-regression -Recurse -Force -ErrorAction SilentlyContinue

      - name: Publish self-contained W0 shell
        working-directory: Windows
        run: >-
          dotnet publish src/Witness.App/Witness.App.csproj
          --configuration Release
          --no-restore
          -p:PublishProfile=Beta
          --output artifacts/publish

      - name: Add native CPU binaries
        shell: pwsh
        run: |
          Copy-Item Windows/artifacts/native/bin/Release/*.dll Windows/artifacts/publish -Force
          if (-not (Test-Path Windows/artifacts/publish/Witness.Native.dll)) {
            throw "Witness.Native.dll was not produced."
          }

      - name: Enforce artifact privacy boundary
        shell: pwsh
        run: Windows/tools/assert-artifact-privacy.ps1 -Path Windows/artifacts/publish

      - name: Build installed W7 A and B fixtures
        shell: pwsh
        run: |
          dotnet publish Windows/src/Witness.App/Witness.App.csproj `
            --configuration Release --no-restore -p:PublishProfile=Beta `
            -p:Version=0.1.0 -p:WitnessBuildNumber=101 -p:WitnessEnableW7Harness=true `
            --output Windows/artifacts/w7-a
          Copy-Item Windows/artifacts/native/bin/Release/*.dll Windows/artifacts/w7-a -Force
          dotnet vpk pack --packId Witness.Windows.Beta --packVersion 0.1.0 `
            --packDir Windows/artifacts/w7-a --mainExe Witness.exe --channel beta `
            --runtime win-x64 --delta None --outputDir Windows/artifacts/w7-feed
          $setups = @(Get-ChildItem Windows/artifacts/w7-feed -File -Filter "*Setup.exe")
          if ($setups.Count -ne 1) { throw "Expected one synthetic A setup; found $($setups.Count)." }
          Copy-Item $setups[0].FullName Windows/artifacts/w7-a-setup.exe -Force

          dotnet publish Windows/src/Witness.App/Witness.App.csproj `
            --configuration Release --no-restore -p:PublishProfile=Beta `
            -p:Version=0.1.1 -p:WitnessBuildNumber=102 -p:WitnessEnableW7Harness=true `
            --output Windows/artifacts/w7-b
          Copy-Item Windows/artifacts/native/bin/Release/*.dll Windows/artifacts/w7-b -Force
          dotnet vpk pack --packId Witness.Windows.Beta --packVersion 0.1.1 `
            --packDir Windows/artifacts/w7-b --mainExe Witness.exe --channel beta `
            --runtime win-x64 --delta None --outputDir Windows/artifacts/w7-feed
          $setups = @(Get-ChildItem Windows/artifacts/w7-feed -File -Filter "*Setup.exe")
          if ($setups.Count -ne 1) { throw "Expected one synthetic B setup; found $($setups.Count)." }
          Copy-Item $setups[0].FullName Windows/artifacts/w7-b-setup.exe -Force
          Windows/tools/assert-artifact-privacy.ps1 -Path Windows/artifacts/w7-feed

      - name: Install A, apply B, uninstall, reinstall, and verify preserved state
        shell: pwsh
        run: |
          $setupA = (Resolve-Path Windows/artifacts/w7-a-setup.exe).Path
          $setupB = (Resolve-Path Windows/artifacts/w7-b-setup.exe).Path
          $feed = (Resolve-Path Windows/artifacts/w7-feed).Path
          $marker = Join-Path $env:RUNNER_TEMP "witness-w7-preserved.txt"
          $install = Start-Process $setupA -ArgumentList "--silent" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Synthetic A install failed with exit code $($install.ExitCode)." }
          $candidates = @(Get-ChildItem $env:LOCALAPPDATA -Recurse -Depth 6 -File -Filter Witness.exe |
            Where-Object { $_.FullName -like "*Witness.Windows.Beta*current*" })
          if ($candidates.Count -ne 1) { throw "Expected one installed current Witness.exe; found $($candidates.Count)." }
          & $candidates[0].FullName --w7-seed-data
          if ($LASTEXITCODE -ne 0) { throw "Synthetic A could not seed preservation state." }
          & $candidates[0].FullName --w7-apply-update $feed $marker
          if ($LASTEXITCODE -ne 0) { throw "Synthetic A could not launch the manual B apply." }
          $deadline = [DateTime]::UtcNow.AddSeconds(60)
          while (-not (Test-Path $marker) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $marker) -or (Get-Content $marker -Raw).Trim() -ne "W7_A_TO_B_PRESERVED") {
            throw "Installed B did not confirm the A-to-B preservation contract."
          }
          if (Test-Path (Join-Path $env:LOCALAPPDATA "Witness\glossary.json")) {
            throw "A forbidden persisted glossary was found after A-to-B."
          }

          $currentExe = $candidates[0].FullName
          $installRoot = Split-Path (Split-Path $currentExe -Parent) -Parent
          $updateExe = Join-Path $installRoot "Update.exe"
          if (-not (Test-Path $updateExe)) { throw "Installed Velopack Update.exe was not found." }
          $uninstall = Start-Process $updateExe -ArgumentList "uninstall", "--silent" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Synthetic B uninstall failed with exit code $($uninstall.ExitCode)." }
          $deadline = [DateTime]::UtcNow.AddSeconds(60)
          while ((Test-Path $currentExe) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Seconds 1 }
          if (Test-Path $currentExe) { throw "Synthetic B remained installed after uninstall." }
          $localData = Join-Path $env:LOCALAPPDATA "Witness"
          @("settings.json", "license.json", "Models\synthetic-w7-model.bin") | ForEach-Object {
            if (-not (Test-Path (Join-Path $localData $_))) {
              throw "Uninstall removed preserved local data: $_"
            }
          }
          if (Test-Path (Join-Path $localData "glossary.json")) {
            throw "A forbidden persisted glossary was found after uninstall."
          }

          $reinstall = Start-Process $setupB -ArgumentList "--silent" -Wait -PassThru
          if ($reinstall.ExitCode -ne 0) { throw "Synthetic B reinstall failed with exit code $($reinstall.ExitCode)." }
          $reinstalled = @(Get-ChildItem $env:LOCALAPPDATA -Recurse -Depth 6 -File -Filter Witness.exe |
            Where-Object { $_.FullName -like "*Witness.Windows.Beta*current*" })
          if ($reinstalled.Count -ne 1) { throw "Expected one reinstalled current Witness.exe; found $($reinstalled.Count)." }
          $reinstallMarker = Join-Path $env:RUNNER_TEMP "witness-w7-reinstalled.txt"
          & $reinstalled[0].FullName --w7-verify-data $reinstallMarker
          if ($LASTEXITCODE -ne 0 -or
              -not (Test-Path $reinstallMarker) -or
              (Get-Content $reinstallMarker -Raw).Trim() -ne "W7_A_TO_B_PRESERVED") {
            throw "Reinstalled B did not confirm the preservation contract."
          }
          Write-Host "Installed A-to-B and uninstall/reinstall preserved settings, entitlement, model and hardware identity."

      - name: Assemble and validate synthetic W8 tester kit
        shell: pwsh
        run: |
          $package = "Windows/artifacts/w8-package-smoke"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item Windows/artifacts/w7-b-setup.exe (Join-Path $package "Witness.Windows.Beta-win-Setup.exe")
          Windows/tools/New-W8BetaKit.ps1 `
            -PackagePath $package `
            -OutputPath Windows/artifacts/w8-kit-smoke `
            -Version 0.1.1 `
            -Build 102 `
            -SourceRevision "${{ github.sha }}" `
            -TrustState unsigned-internal
          Windows/tools/Test-W8BetaKit.ps1 -Path Windows/artifacts/w8-kit-smoke
          $info = Get-Content Windows/artifacts/w8-kit-smoke/BUILD_INFO.json -Raw | ConvertFrom-Json
          if ($info.trustState -cne "unsigned-internal" -or
              $info.activationConfigured -ne $false -or
              $info.updatesConfigured -ne $false -or
              $info.nativeBackend -cne "cpu") {
            throw "Synthetic W8 kit does not preserve its explicit internal trust/configuration boundary."
          }

      - name: Upload W0 build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: witness-windows-w0-shell-${{ github.sha }}
          path: Windows/artifacts/publish
          if-no-files-found: error
          retention-days: 7
