name: Windows unsigned internal package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Internal package version
        required: true
        default: "0.1.0"
        type: string
      configure_activation:
        description: Require the isolated Windows beta authority and HTTPS endpoint from repository secrets
        required: true
        default: false
        type: boolean
      configure_updates:
        description: Require the isolated signed Windows beta update configuration and produce a signed manifest
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  package:
    name: Unsigned beta package
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: Windows/**/packages.lock.json

      - name: Restore locked packages and tools
        run: |
          dotnet restore Windows/Witness.Windows.sln --locked-mode
          dotnet restore Windows/src/Witness.App/Witness.App.csproj --locked-mode -p:PublishProfile=Beta -p:PublishReadyToRun=true
          dotnet tool restore

      - name: Configure and build native CPU adapter
        run: |
          cmake -S Windows/native/Witness.Native -B Windows/artifacts/native -DWITNESS_ENABLE_VULKAN=OFF -DWITNESS_BUILD_TESTS=OFF
          cmake --build Windows/artifacts/native --config Release --parallel 2

      - name: Publish self-contained x64 app
        shell: pwsh
        env:
          WITNESS_BETA_LICENSE_PUBLIC_KEY: ${{ secrets.WINDOWS_BETA_LICENSE_PUBLIC_KEY }}
          WITNESS_BETA_ACTIVATION_ENDPOINT: ${{ secrets.WINDOWS_BETA_ACTIVATION_ENDPOINT }}
          WITNESS_UPDATE_KEY_ID: ${{ secrets.WINDOWS_BETA_UPDATE_KEY_ID }}
          WITNESS_UPDATE_MANIFEST_PUBLIC_KEY: ${{ secrets.WINDOWS_BETA_UPDATE_MANIFEST_PUBLIC_KEY }}
          WITNESS_UPDATE_MANIFEST_ENDPOINT: ${{ secrets.WINDOWS_BETA_UPDATE_MANIFEST_ENDPOINT }}
          WITNESS_UPDATE_PACKAGE_HOSTS: ${{ secrets.WINDOWS_BETA_UPDATE_PACKAGE_HOSTS }}
        run: |
          $required = "${{ inputs.configure_activation }}".ToLowerInvariant()
          $updatesRequired = "${{ inputs.configure_updates }}".ToLowerInvariant()
          if ($required -eq "true" -and ([string]::IsNullOrWhiteSpace($env:WITNESS_BETA_LICENSE_PUBLIC_KEY) -or [string]::IsNullOrWhiteSpace($env:WITNESS_BETA_ACTIVATION_ENDPOINT))) {
            throw "Configured beta packaging requires WINDOWS_BETA_LICENSE_PUBLIC_KEY and WINDOWS_BETA_ACTIVATION_ENDPOINT repository secrets."
          }
          if ($required -eq "true") {
            try { $authority = [Convert]::FromBase64String($env:WITNESS_BETA_LICENSE_PUBLIC_KEY) }
            catch { throw "WINDOWS_BETA_LICENSE_PUBLIC_KEY must be valid Base64." }
            if ($authority.Length -ne 32) {
              throw "WINDOWS_BETA_LICENSE_PUBLIC_KEY must contain exactly 32 bytes."
            }
            $endpoint = $null
            if (-not [Uri]::TryCreate($env:WITNESS_BETA_ACTIVATION_ENDPOINT, [UriKind]::Absolute, [ref]$endpoint) -or
                $endpoint.Scheme -ne "https" -or
                $endpoint.AbsolutePath -cne "/v1/activate" -or
                -not [string]::IsNullOrEmpty($endpoint.UserInfo) -or
                -not [string]::IsNullOrEmpty($endpoint.Query) -or
                -not [string]::IsNullOrEmpty($endpoint.Fragment)) {
              throw "WINDOWS_BETA_ACTIVATION_ENDPOINT must be an exact HTTPS /v1/activate URL without user info, query, or fragment."
            }
          }
          $missingUpdateValues = @(
              $env:WITNESS_UPDATE_KEY_ID,
              $env:WITNESS_UPDATE_MANIFEST_PUBLIC_KEY,
              $env:WITNESS_UPDATE_MANIFEST_ENDPOINT,
              $env:WITNESS_UPDATE_PACKAGE_HOSTS
            ) | Where-Object { [string]::IsNullOrWhiteSpace($_) }
          if ($updatesRequired -eq "true" -and $missingUpdateValues.Count -gt 0) {
            throw "Configured beta updates require the key ID, public key, manifest endpoint and package-host secrets."
          }
          if ($updatesRequired -eq "true") {
            try { $updateAuthority = [Convert]::FromBase64String($env:WITNESS_UPDATE_MANIFEST_PUBLIC_KEY) }
            catch { throw "WINDOWS_BETA_UPDATE_MANIFEST_PUBLIC_KEY must be valid Base64." }
            if ($updateAuthority.Length -ne 32) {
              throw "WINDOWS_BETA_UPDATE_MANIFEST_PUBLIC_KEY must contain exactly 32 bytes."
            }
            if ($env:WITNESS_UPDATE_KEY_ID -notmatch '^[A-Za-z0-9._-]{1,80}$') {
              throw "WINDOWS_BETA_UPDATE_KEY_ID must be a short stable identifier."
            }
            $manifestEndpoint = $null
            if (-not [Uri]::TryCreate($env:WITNESS_UPDATE_MANIFEST_ENDPOINT, [UriKind]::Absolute, [ref]$manifestEndpoint) -or
                $manifestEndpoint.Scheme -ne "https" -or
                -not [string]::IsNullOrEmpty($manifestEndpoint.UserInfo) -or
                -not [string]::IsNullOrEmpty($manifestEndpoint.Query) -or
                -not [string]::IsNullOrEmpty($manifestEndpoint.Fragment)) {
              throw "WINDOWS_BETA_UPDATE_MANIFEST_ENDPOINT must be an exact HTTPS URL without user info, query, or fragment."
            }
            $packageHosts = @($env:WITNESS_UPDATE_PACKAGE_HOSTS.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ })
            if ($packageHosts.Count -eq 0 -or @($packageHosts | Where-Object { [Uri]::CheckHostName($_) -eq [UriHostNameType]::Unknown }).Count -gt 0) {
              throw "WINDOWS_BETA_UPDATE_PACKAGE_HOSTS must contain comma-separated bare DNS names or IP addresses."
            }
          }
          dotnet publish Windows/src/Witness.App/Witness.App.csproj `
            --configuration Release `
            --no-restore `
            -p:PublishProfile=Beta `
            -p:Version=${{ inputs.version }} `
            -p:WitnessBuildNumber=${{ github.run_number }} `
            -p:WitnessRequireBetaActivation=$required `
            -p:WitnessBetaLicensePublicKey="$env:WITNESS_BETA_LICENSE_PUBLIC_KEY" `
            -p:WitnessBetaActivationEndpoint="$env:WITNESS_BETA_ACTIVATION_ENDPOINT" `
            -p:WitnessRequireBetaUpdates=$updatesRequired `
            -p:WitnessUpdateKeyId="$env:WITNESS_UPDATE_KEY_ID" `
            -p:WitnessUpdateManifestPublicKey="$env:WITNESS_UPDATE_MANIFEST_PUBLIC_KEY" `
            -p:WitnessUpdateManifestEndpoint="$env:WITNESS_UPDATE_MANIFEST_ENDPOINT" `
            -p:WitnessUpdatePackageHosts="$env:WITNESS_UPDATE_PACKAGE_HOSTS" `
            --output Windows/artifacts/publish

      - name: Add native CPU binaries
        shell: pwsh
        run: Copy-Item Windows/artifacts/native/bin/Release/*.dll Windows/artifacts/publish -Force

      - name: Enforce artifact privacy boundary
        shell: pwsh
        run: Windows/tools/assert-artifact-privacy.ps1 -Path Windows/artifacts/publish

      - name: Build unsigned internal Velopack package
        run: >-
          dotnet vpk pack
          --packId Witness.Windows.Beta
          --packVersion ${{ inputs.version }}
          --packDir Windows/artifacts/publish
          --mainExe Witness.exe
          --channel beta
          --runtime win-x64
          --delta None
          --outputDir Windows/artifacts/package

      - name: Create signed update manifest
        if: inputs.configure_updates
        shell: pwsh
        env:
          WITNESS_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.WINDOWS_BETA_UPDATE_SIGNING_PRIVATE_KEY }}
          WITNESS_UPDATE_MANIFEST_PUBLIC_KEY: ${{ secrets.WINDOWS_BETA_UPDATE_MANIFEST_PUBLIC_KEY }}
          WITNESS_UPDATE_KEY_ID: ${{ secrets.WINDOWS_BETA_UPDATE_KEY_ID }}
          WITNESS_UPDATE_PACKAGE_URL: ${{ secrets.WINDOWS_BETA_UPDATE_PACKAGE_URL }}
          WITNESS_UPDATE_PACKAGE_HOSTS: ${{ secrets.WINDOWS_BETA_UPDATE_PACKAGE_HOSTS }}
        run: |
          $missingSigningValues = @(
              $env:WITNESS_UPDATE_SIGNING_PRIVATE_KEY,
              $env:WITNESS_UPDATE_MANIFEST_PUBLIC_KEY,
              $env:WITNESS_UPDATE_KEY_ID,
              $env:WITNESS_UPDATE_PACKAGE_URL,
              $env:WITNESS_UPDATE_PACKAGE_HOSTS
            ) | Where-Object { [string]::IsNullOrWhiteSpace($_) }
          if ($missingSigningValues.Count -gt 0) {
            throw "Signed beta metadata requires the private signing seed, matching public key, key ID and exact package URL."
          }
          $packages = @(Get-ChildItem Windows/artifacts/package -File -Filter "*-full.nupkg")
          if ($packages.Count -ne 1) {
            throw "Expected exactly one full Velopack package; found $($packages.Count)."
          }
          dotnet run --project Windows/tools/Witness.UpdateManifestTool/Witness.UpdateManifestTool.csproj `
            --configuration Release --no-restore -- `
            --package $packages[0].FullName `
            --package-url $env:WITNESS_UPDATE_PACKAGE_URL `
            --package-hosts $env:WITNESS_UPDATE_PACKAGE_HOSTS `
            --output Windows/artifacts/package/envelope.json `
            --release-notes Windows/RELEASE_NOTES_W7_INTERNAL.md `
            --version ${{ inputs.version }} `
            --build ${{ github.run_number }} `
            --key-id $env:WITNESS_UPDATE_KEY_ID

      - name: Create SHA-256 inventory
        shell: pwsh
        run: |
          Get-ChildItem Windows/artifacts/package -File |
            Sort-Object Name |
            ForEach-Object { "$(($_ | Get-FileHash -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content Windows/artifacts/package/SHA256SUMS.txt -Encoding ascii

      - name: Re-check package contents
        shell: pwsh
        run: Windows/tools/assert-artifact-privacy.ps1 -Path Windows/artifacts/package

      - name: Upload unsigned internal package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: witness-windows-unsigned-${{ inputs.version }}-${{ github.sha }}
          path: Windows/artifacts/package
          if-no-files-found: error
          retention-days: 7

      - name: State trust boundary
        shell: pwsh
        run: |
          Write-Host "Unsigned internal artifact only. Not approved for external distribution; no Windows code-signing credential was used."
          Write-Host "Closed-beta activation requested: ${{ inputs.configure_activation }}. The private license key was never available to this build."
          Write-Host "Signed update metadata requested: ${{ inputs.configure_updates }}. The update signing seed was available only to the manifest-signing step."
          Write-Host "Windows executable code signing remains an external release gate."
